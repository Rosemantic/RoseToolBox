name: Check external links

on:
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check resource links
        run: npm run check-links -- --output reports/link-report.json --no-fail

      - name: Upload link report
        uses: actions/upload-artifact@v6
        with:
          name: rosetools-link-report
          path: reports/link-report.json
          retention-days: 30
